# Production deployment (namespace: prod) — FREE-TIER SLIM VARIANT.
# Single t3.small node: ONE Deployment, ONE replica, API-only (ROLE=api).
# Canary disabled on free tier (needs >=2 pods). Uses ${ECR_REGISTRY} and ${IMAGE_TAG}.
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qsr-eta-api
  namespace: prod
  labels: { app: qsr-eta-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: qsr-eta-api }
  template:
    metadata:
      labels: { app: qsr-eta-api }
    spec:
      serviceAccountName: qsr-eta-api
      containers:
        - name: api
          image: ${ECR_REGISTRY}/qsr-eta-prediction:${IMAGE_TAG}
          ports: [{ containerPort: 8000 }]
          env:
            - { name: ROLE, value: "api" }
            - { name: MODEL_VERSION, value: "${IMAGE_TAG}" }
            - { name: S3_BUCKET, valueFrom: { configMapKeyRef: { name: qsr-eta-config, key: s3_bucket } } }
            - { name: AWS_REGION, valueFrom: { configMapKeyRef: { name: qsr-eta-config, key: aws_region } } }
            - { name: MODEL_MAPE_GATE, valueFrom: { configMapKeyRef: { name: qsr-eta-config, key: mape_gate } } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits:   { cpu: "500m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: qsr-eta-api
  namespace: prod
spec:
  selector: { app: qsr-eta-api }
  ports:
    - { name: api, port: 80, targetPort: 8000 }
  type: LoadBalancer
