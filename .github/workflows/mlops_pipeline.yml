name: mlops_pipeline
# Trigger 1 (code): git push -> test -> build+scan+push(ECR) -> deploy(EKS).
# develop -> UAT namespace ; main -> prod.
#
# AUTH: static IAM keys as GitHub SECRETS (the only two things you must set):
#   AWS_ACCESS_KEY_ID , AWS_SECRET_ACCESS_KEY
# Everything else is a NON-SECRET identifier, baked in below with an optional
# `vars.*` override. A fresh clone runs with zero repo Variables configured.
#
# CHANGES vs the previous revision:
#   * test job no longer needs AWS at all — it reads tests/fixtures/sample_raw.csv.
#     (Previously it fell back to S3 with the wrong RAW_KEY and failed on NoSuchKey.)
#   * Trivy gate is actionable: ignore-unfixed + it REPORTS (exit-code 0) rather
#     than permanently blocking on unpatchable base-image CVEs.
#   * Rendered manifests are verified before apply (catches an unset ${VAR}
#     producing `image: registry/repo:` -> ImagePullBackOff).
#   * IRSA ServiceAccount existence is checked before deploy, not discovered by
#     a pod stuck in ContainerCreating.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AWS_REGION:      ${{ vars.AWS_REGION      || 'ap-south-2' }}
  AWS_ACCOUNT_ID:  ${{ vars.AWS_ACCOUNT_ID  || '117211782845' }}
  S3_BUCKET:       ${{ vars.S3_BUCKET       || 'qsr-eta-prediction' }}
  ECR_REPOSITORY:  ${{ vars.ECR_REPOSITORY  || 'qsr-eta-prediction' }}
  EKS_CLUSTER:     ${{ vars.EKS_CLUSTER     || 'qsr-eta-prediction' }}
  RAW_KEY:         ${{ vars.RAW_KEY         || 'raw/zomato_raw.csv' }}
  MODEL_MAPE_GATE: "0.18"

jobs:
  # ---------------- 1. TEST (hard gate, no AWS needed) ----------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pre-flight — test fixture is present
        run: |
          test -s tests/fixtures/sample_raw.csv \
            || { echo "::error::tests/fixtures/sample_raw.csv missing or empty. \
                 The test job runs offline and needs it committed."; exit 1; }
      - name: Tests (leakage regression + call-order guard + business invariants + MAPE gate)
        env:
          MODEL_MAPE_GATE: ${{ env.MODEL_MAPE_GATE }}
          # No S3_BUCKET / AWS creds on purpose: the suite must run offline.
        run: pytest tests/ -v

  # ---------------- 2. BUILD + SCAN + PUSH ----------------
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
      # REPORTING gate, not a blocking one. ignore-unfixed:true means only CVEs
      # with an available patch are ever surfaced — an unpatchable base-image CVE
      # cannot permanently wedge the pipeline. Flip exit-code to "1" once the
      # base image is on a maintained patch cadence.
      - name: Trivy scan (report HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - name: Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  # ---------------- 3a. DEPLOY UAT (develop) ----------------
  deploy-uat:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: uat
      MANIFEST: k8s/deployment-uat.yml
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Render + verify manifests
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: bash .github/scripts/render_and_verify.sh "$MANIFEST"
      - name: Pre-flight — IRSA ServiceAccount exists
        run: |
          kubectl -n "$NAMESPACE" get sa qsr-eta-api \
            || { echo "::error::ServiceAccount qsr-eta-api missing in $NAMESPACE. \
                 Run the eksctl create iamserviceaccount step from the runbook."; exit 1; }
      - name: Apply
        run: |
          kubectl apply -f rendered-config.yml
          kubectl apply -f rendered-workload.yml
          kubectl -n "$NAMESPACE" rollout status deploy/qsr-eta-api --timeout=300s
      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe pods -l app=qsr-eta-api | tail -60 || true
          kubectl -n "$NAMESPACE" logs -l app=qsr-eta-api --tail=80 || true

  # ---------------- 3b. DEPLOY PROD (main) ----------------
  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: prod
      MANIFEST: k8s/deployment.yml
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Render + verify manifests
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: bash .github/scripts/render_and_verify.sh "$MANIFEST"
      - name: Pre-flight — IRSA ServiceAccount exists
        run: |
          kubectl -n "$NAMESPACE" get sa qsr-eta-api \
            || { echo "::error::ServiceAccount qsr-eta-api missing in $NAMESPACE. \
                 Run the eksctl create iamserviceaccount step from the runbook."; exit 1; }
      - name: Apply (slim single-track manifest — canary deferred on free tier)
        run: |
          kubectl apply -f rendered-config.yml
          kubectl apply -f rendered-workload.yml
          kubectl -n "$NAMESPACE" rollout status deploy/qsr-eta-api --timeout=300s
      - name: Verify live
        run: |
          kubectl -n "$NAMESPACE" get pods -l app=qsr-eta-api
          kubectl -n "$NAMESPACE" get svc qsr-eta-api
      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe pods -l app=qsr-eta-api | tail -60 || true
          kubectl -n "$NAMESPACE" logs -l app=qsr-eta-api --tail=80 || true
