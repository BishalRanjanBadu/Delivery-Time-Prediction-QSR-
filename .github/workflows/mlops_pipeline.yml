name: mlops_pipeline
# Trigger 1 (code): git push -> test -> build+scan+push(ECR) -> deploy(EKS).
# develop -> UAT namespace ; main -> prod.
# AUTH: only two GitHub SECRETS are required:
#   AWS_ACCESS_KEY_ID , AWS_SECRET_ACCESS_KEY
# All other identifiers are non-secret and baked in below (override via repo
# Variables if you ever need to change them without editing this file).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AWS_REGION:      ${{ vars.AWS_REGION      || 'ap-south-2' }}
  AWS_ACCOUNT_ID:  ${{ vars.AWS_ACCOUNT_ID  || '117211782845' }}
  S3_BUCKET:       ${{ vars.S3_BUCKET       || 'qsr-eta-prediction' }}
  ECR_REPOSITORY:  ${{ vars.ECR_REPOSITORY  || 'qsr-eta-prediction' }}
  EKS_CLUSTER:     ${{ vars.EKS_CLUSTER     || 'qsr-eta-prediction' }}
  RAW_KEY:         ${{ vars.RAW_KEY         || 'raw/zomato_raw.csv' }}
  MODEL_MAPE_GATE: "0.18"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Tests (leakage regression + call-order guard + business invariants + MAPE gate)
        env:
          MODEL_MAPE_GATE: ${{ env.MODEL_MAPE_GATE }}
          S3_BUCKET:       ${{ env.S3_BUCKET }}
          AWS_REGION:      ${{ env.AWS_REGION }}
          RAW_KEY:         ${{ env.RAW_KEY }}
        run: pytest tests/ -v

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy-uat:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Deploy UAT
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          envsubst < k8s/config.yml         | kubectl apply -f -
          envsubst < k8s/deployment-uat.yml | kubectl apply -f -
          kubectl -n uat rollout status deploy/qsr-eta-api --timeout=300s

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Deploy prod (slim free-tier manifest)
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          envsubst < k8s/config.yml     | kubectl apply -f -
          envsubst < k8s/deployment.yml | kubectl apply -f -
          kubectl -n prod rollout status deploy/qsr-eta-api --timeout=300s
      - name: Verify live
        run: |
          kubectl -n prod get pods -l app=qsr-eta-api
          kubectl -n prod get svc qsr-eta-api
