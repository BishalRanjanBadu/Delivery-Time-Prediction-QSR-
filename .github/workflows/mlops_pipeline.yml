name: mlops_pipeline
# Trigger 1 (code): git push -> test -> build+scan+push(ECR) -> deploy(EKS).
# develop -> UAT namespace ; main -> prod.
#
# AUTH: two GitHub SECRETS only — AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
# Every other identifier is baked in below with a vars.* override, so a fresh
# clone runs with zero repo Variables configured.
#
# EXTERNAL REFERENCES — all verified to exist upstream:
#   actions/checkout@v4                       (v1..v7 published)
#   actions/setup-python@v5                   (v1..v7 published)
#   aws-actions/configure-aws-credentials@v4  (v1..v6 published)
#   aws-actions/amazon-ecr-login@v2           (v1..v2 published)
#   aquasecurity/trivy-action@v0.33.1         (tags are v-PREFIXED — "0.28.0"
#                                              does not resolve, "v0.28.0" does)
# Runner binaries used: python, docker, envsubst, kubectl, aws — all present on
# ubuntu-latest. The render script degrades gracefully if PyYAML is absent.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AWS_REGION:      ${{ vars.AWS_REGION      || 'ap-south-2' }}
  AWS_ACCOUNT_ID:  ${{ vars.AWS_ACCOUNT_ID  || '117211782845' }}
  S3_BUCKET:       ${{ vars.S3_BUCKET       || 'qsr-eta-prediction' }}
  ECR_REPOSITORY:  ${{ vars.ECR_REPOSITORY  || 'qsr-eta-prediction' }}
  EKS_CLUSTER:     ${{ vars.EKS_CLUSTER     || 'qsr-eta-prediction' }}
  RAW_KEY:         ${{ vars.RAW_KEY         || 'raw/zomato_raw.csv' }}
  MODEL_MAPE_GATE: "0.18"

jobs:
  # ---------------- 1. TEST (hard gate, runs fully offline) ----------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pre-flight - offline test fixture present
        run: |
          test -s tests/fixtures/sample_raw.csv \
            || { echo "::error::tests/fixtures/sample_raw.csv missing or empty."; exit 1; }
      - name: Tests (leakage + call-order + business invariants + MAPE gate)
        env:
          MODEL_MAPE_GATE: ${{ env.MODEL_MAPE_GATE }}
        # No AWS credentials on purpose: the suite must pass with none.
        run: pytest tests/ -v

  # ---------------- 2. BUILD + SCAN + PUSH ----------------
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
      # REPORT-ONLY gate. Three separate guards against wedging the pipeline:
      #   ignore-unfixed  - only CVEs with an available patch are surfaced
      #   exit-code 0     - findings never fail the step
      #   continue-on-error - a Trivy DB pull failure (ghcr.io rate limits are
      #                     common in CI) cannot fail the job either
      # Flip exit-code to "1" and drop continue-on-error once the base image is
      # on a maintained patch cadence.
      - name: Trivy scan (report HIGH/CRITICAL with a fix available)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - name: Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  # ---------------- 3a. DEPLOY UAT (develop) ----------------
  deploy-uat:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: uat
      MANIFEST: k8s/deployment-uat.yml
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Pre-flight - required CLI tools
        run: |
          command -v envsubst >/dev/null || sudo apt-get install -y -q gettext-base
          command -v kubectl  >/dev/null || { \
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"; \
            sudo install -m 0755 kubectl /usr/local/bin/kubectl; }
          kubectl version --client
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Render + verify manifests
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: bash .github/scripts/render_and_verify.sh "$MANIFEST"
      - name: Pre-flight - IRSA ServiceAccount exists
        run: |
          kubectl -n "$NAMESPACE" get sa qsr-eta-api \
            || { echo "::error::ServiceAccount qsr-eta-api missing in $NAMESPACE. Run eksctl create iamserviceaccount."; exit 1; }
      - name: Apply
        run: |
          kubectl apply -f rendered-config.yml
          kubectl apply -f rendered-workload.yml
          kubectl -n "$NAMESPACE" rollout status deploy/qsr-eta-api --timeout=300s
      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe pods -l app=qsr-eta-api | tail -60 || true
          kubectl -n "$NAMESPACE" logs -l app=qsr-eta-api --tail=80 || true

  # ---------------- 3b. DEPLOY PROD (main) ----------------
  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: prod
      MANIFEST: k8s/deployment.yml
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Pre-flight - required CLI tools
        run: |
          command -v envsubst >/dev/null || sudo apt-get install -y -q gettext-base
          command -v kubectl  >/dev/null || { \
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"; \
            sudo install -m 0755 kubectl /usr/local/bin/kubectl; }
          kubectl version --client
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Render + verify manifests
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: bash .github/scripts/render_and_verify.sh "$MANIFEST"
      - name: Pre-flight - IRSA ServiceAccount exists
        run: |
          kubectl -n "$NAMESPACE" get sa qsr-eta-api \
            || { echo "::error::ServiceAccount qsr-eta-api missing in $NAMESPACE. Run eksctl create iamserviceaccount."; exit 1; }
      - name: Apply (slim single-track manifest - canary deferred on free tier)
        run: |
          kubectl apply -f rendered-config.yml
          kubectl apply -f rendered-workload.yml
          kubectl -n "$NAMESPACE" rollout status deploy/qsr-eta-api --timeout=300s
      - name: Verify live
        run: |
          kubectl -n "$NAMESPACE" get pods -l app=qsr-eta-api
          kubectl -n "$NAMESPACE" get svc qsr-eta-api
      - name: Diagnose on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe pods -l app=qsr-eta-api | tail -60 || true
          kubectl -n "$NAMESPACE" logs -l app=qsr-eta-api --tail=80 || true